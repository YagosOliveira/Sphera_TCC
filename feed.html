  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #fff;
      --text: #0f172a;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #4e0e0e;

      --shadow: 0 2px 8px rgba(0, 0, 0, .06), 0 12px 28px rgba(0, 0, 0, .08);
      --radius: 16px;
      --radius-sm: 12px;

      --container: 1120px;
      --gap: 16px;
      --topbar-h: 56px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Topbar */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      height: var(--topbar-h);
      display: flex;
      align-items: center;
      background: var(--primary);
      color: #fff;
      box-shadow: 0 1px 0 rgba(0, 0, 0, .06);
    }

    .topbar .wrap {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .topbar a {
      color: inherit;
      text-decoration: none;
      font-weight: 600;
    }

    /* Feed grid */
    .feed-wrap {
      max-width: var(--container);
      margin: 18px auto 64px;
      padding: 0 16px;

      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 30px;
    }

    @media (max-width:980px) {
      .feed-wrap {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width:620px) {
      .feed-wrap {
        grid-template-columns: 1fr;
      }
    }

    /* Post card (IG-like) */
    .post-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Header (avatar + name) */
    .post-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 999px;
      object-fit: cover;
      flex: 0 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .venue-title {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .venue-title a {
      text-decoration: none;
      color: #111827;
      font-size: 14px;
      font-weight: 800;
    }

    .venue-title small {
      color: var(--muted);
      font-size: 12px;
    }

    /* Media (square image like IG) */
    .post-media {
      width: 100%;
      background: #f1f5f9;
      aspect-ratio: 1/1;
      overflow: hidden;
    }

    .post-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Caption under the photo */
    .post-caption {
      padding: 10px 12px 12px;
      font-size: 13px;
      color: #111827;
    }

    .post-caption .post-title {
      font-weight: 700;
      margin: 0 0 6px;
    }

    .post-caption .post-body {
      color: #374151;
      line-height: 1.35;

      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      overflow: hidden;
    }

    /* Utilities / actions */
    .loadmore {
      display: flex;
      justify-content: center;
      margin: 12px 0 24px;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: #111827;
      padding: 10px 14px;
      font-weight: 600;
      border-radius: var(--radius-sm);
      cursor: pointer;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .muted {
      color: var(--muted);
    }

    /* Legacy classes (mantidas p/ compatibilidade, mas sem layout em 2 colunas) */
    .post-body {
      padding: 0;
      display: block;
    }

    .post-img {
      width: 100%;
      display: block;
      border-radius: 0;
      box-shadow: none;
      background: none;
    }

    .post-text {
      font-size: inherit;
      color: inherit;
    }


    /* ===== NAVBAR ===== */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      height: 56px;
    }

    .navbar .nav-wrap {
      width: 100%;
      max-width: 1440px;
      margin: 0 auto;
      padding: 0 24px;
      height: 56px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }

    /* Brand */
    .navbar .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 18px;
      color: #4e0e0e;
      text-decoration: none;
      justify-self: start;
      transition: opacity .2s;
    }

    .navbar .brand img {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }

    .navbar .brand:hover {
      opacity: 0.8;
    }

    /* Center nav links */
    .navbar .nav-center {
      justify-self: center;
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: rgba(0, 0, 0, 0.1);
      padding: 3px;
      border-radius: 999px;
    }

    .navbar .nav-link {
      color: #6b7280;
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
      padding: 8px 16px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all .2s;
    }

    .navbar .nav-link:hover {
      color: #111827;
      background: #f3f4f6;
    }

    .navbar .nav-link.is-active {
      color: #4e0e0e;
      background-color: rgba(255, 24, 24, 0.1);
      font-weight: 600;
    }

    .navbar .nav-link svg {
      width: 16px;
      height: 16px;
    }

    /* Right side */
    .navbar .nav-right {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .navbar .nav-login {
      color: #4e0e0e;
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
      padding: 8px 16px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all .2s;
      background: transparent;
      border: none;
      cursor: pointer;
    }

    .navbar .nav-login:hover {
      background: #f3f4f6;
      color: #111827;
    }

    .navbar .nav-login svg {
      width: 16px;
      height: 16px;
    }

    .navbar .nav-pill {
      background: #4e0e0e;
      color: #fff;
      font-weight: 600;
      font-size: 13px;
      padding: 0 18px;
      height: 36px;
      border-radius: 999px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: none;
      transition: all .2s;
    }

    .navbar .nav-pill:hover {
      background: #374151;
    }

    .navbar .nav-pill svg {
      width: 16px;
      height: 16px;
    }

    /* Responsive navbar */
    @media (max-width: 720px) {
      .navbar .nav-wrap {
        padding: 0 16px;
      }

      .navbar .nav-center {
        gap: 4px;
      }

      .navbar .nav-link {
        padding: 6px 10px;
        font-size: 13px;
      }

      .navbar .brand {
        font-size: 16px;
      }

      .navbar .nav-pill {
        padding: 0 14px;
        height: 34px;
        font-size: 12px;
      }
    }
  </style>


</head>

<body>
  <div class="navbar">
    <div class="nav-wrap" role="navigation" aria-label="Barra de navegação">
      <a class="brand" href="/">
        <img src="/assets/icons/logo_sombra.svg" alt="Sphera">
        SPHERA
      </a>

      <!-- NAV central com os links -->
      <nav class="nav-center">
        <a href="/feed.html" class="nav-link is-active" data-key="feed">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-newspaper-icon lucide-newspaper"><path d="M15 18h-5"/><path d="M18 14h-8"/><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-4 0v-9a2 2 0 0 1 2-2h2"/><rect width="8" height="4" x="10" y="6" rx="1"/></svg>
          Feed
        </a>
        <a href="/index.html" class="nav-link" data-key="menu">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-map-icon lucide-map"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15"/><path d="M9 3.236v15"/></svg>
          Mapa
        </a>
      </nav>

      <div class="nav-right">
        <a class="nav-login" href="/login.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
          Entrar
        </a>
        <button id="btnPerfil" class="nav-pill" title="Seu perfil">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>

  <main class="feed-wrap" id="feed"></main>
  <div class="loadmore"><button class="btn" id="btnMore">Carregar mais</button></div>

  <script type="module">
    const $ = (s, p = document) => p.querySelector(s);
    const feedEl = $('#feed');
    const btnMore = $('#btnMore');

    function timeAgo(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      const diff = (Date.now() - d.getTime()) / 1000;
      if (diff < 60) return 'agora pouco';
      if (diff < 3600) return `${Math.floor(diff / 60)} min`;
      if (diff < 86400) return `${Math.floor(diff / 3600)} h`;
      return d.toLocaleDateString();
    }

    const PAGE_SIZE = 3;
    let page = 0, loading = false, finished = false;

    function showNoPosts() {
      if (!document.getElementById('noPostsMsg')) {
        const p = document.createElement('p');
        p.id = 'noPostsMsg';
        p.className = 'muted';
        p.textContent = 'Ainda não há postagens.';
        feedEl.appendChild(p);
      }
    }
    function hideNoPosts() {
      document.getElementById('noPostsMsg')?.remove();
    }

    async function fetchPage() {
      if (loading || finished) return [];
      loading = true;

      const from = page * PAGE_SIZE;
      const to = from + PAGE_SIZE - 1;

      const { data, error } = await supabase
        .from('posts')
        .select(`id,title,body,image_url,created_at,
                  venue:venue_id (id,name,slug,logo_url)`)
        .eq('published', true)
        .order('created_at', { ascending: false })
        .range(from, to);

      loading = false;
      if (error) { console.error('[feed] erro:', error); return []; }
      if (!data || data.length < PAGE_SIZE) finished = true;
      page++;
      return data || [];
    }

    function safeImgUrl(url) {
      try {
        if (!url) return '';
        const u = new URL(url, location.origin);
        return u.href;
      } catch { return ''; }
    }

    function renderPosts(posts) {
      if (!posts || posts.length === 0) {
        if (feedEl.children.length === 0) showNoPosts();
        return;
      }
      hideNoPosts();

      for (const p of posts) {
        const v = p.venue || {};

        const a = document.createElement('article');
        a.className = 'post-card';

        // --- header
        const head = document.createElement('div');
        head.className = 'post-head';

        const avatar = document.createElement('img');
        avatar.className = 'avatar';
        avatar.alt = `Foto de ${v.name || 'Estabelecimento'}`;
        avatar.loading = 'lazy';
        avatar.decoding = 'async';
        avatar.referrerPolicy = 'no-referrer';
        avatar.src = safeImgUrl(v.logo_url) || './assets/images/avatar-fallback.png';

        const titleWrap = document.createElement('div');
        titleWrap.className = 'venue-title';

        const link = document.createElement('a');
        link.href = `/profile.html?slug=${encodeURIComponent(v.slug || '')}`;
        link.textContent = v.name || 'Estabelecimento';

        const time = document.createElement('small');
        time.className = 'muted';
        time.textContent = timeAgo(p.created_at);

        titleWrap.append(link, time);
        head.append(avatar, titleWrap);

        // --- imagem
        const media = document.createElement('div');
        media.className = 'post-media';

        if (p.image_url) {
          const img = document.createElement('img');
          img.src = safeImgUrl(p.image_url);
          img.alt = p.title ? `Post: ${p.title}` : 'Imagem do post';
          img.loading = 'lazy';
          img.decoding = 'async';
          img.referrerPolicy = 'no-referrer';
          media.appendChild(img);
        } // sem imagem: fica só o bloco “cinza” do .post-media

        // --- legenda
        const caption = document.createElement('div');
        caption.className = 'post-caption';

        const postTitle = document.createElement('div');
        postTitle.className = 'post-title';
        postTitle.textContent = p.title || '';

        const postBody = document.createElement('div');
        postBody.className = 'post-body';
        postBody.textContent = p.body || '';

        caption.append(postTitle, postBody);

        a.append(head, media, caption);
        feedEl.appendChild(a);
      }
    }

    async function loadMore() {
      const rows = await fetchPage();
      renderPosts(rows);
      if (finished) btnMore.style.display = 'none';
    }

    // ---- NOVO: completa a tela automaticamente
    async function ensureFilled() {
      // evita loop infinito com um limite de iterações
      let guard = 8;
      while (!finished && document.documentElement.scrollHeight < (window.innerHeight - 120) && guard-- > 0) {
        await loadMore();
        // aguarda um frame para recalcular a altura
        await new Promise(r => requestAnimationFrame(r));
      }
    }

    // ---- IntersectionObserver (continua útil pra rolagem)
    let io;
    function attachIO() {
      io?.disconnect();
      io = new IntersectionObserver(entries => {
        if (entries.some(e => e.isIntersecting)) loadMore();
      }, { rootMargin: '300px 0px', threshold: 0.01 });
      io.observe(btnMore);
    }

    // ---- BOOT
    document.addEventListener('DOMContentLoaded', async () => {
      await loadMore();     // sempre carrega 1 página
      await ensureFilled(); // e completa a tela se precisar
      attachIO();
    });

    // clique manual
    btnMore.addEventListener('click', async () => {
      await loadMore();
      await ensureFilled();
    });

    // se a janela mudar (ou navbar reflow), revalida
    window.addEventListener('resize', async () => {
      await ensureFilled();
      attachIO();
    });



    const btnProfile = document.getElementById('btnPerfil');

    btnProfile?.addEventListener('click', async (e) => {
      e.preventDefault();
      try {
        const { data: { user }, error: userError } = await supabase.auth.getUser();
        if (userError) throw userError;

        // Sem sessão → manda pro login
        if (!user) {
          location.href = '/login.html';
          return;
        }

        // 1) Descobrir a role
        const { data: prof, error: profError } = await supabase
          .from('profiles')
          .select('role')
          .eq('id', user.id)
          .single();

        if (profError) {
          console.warn('[perfil] erro buscando role, caindo em /user.html', profError);
          location.href = '/user.html';
          return;
        }

        const role = (prof?.role || 'USER').toUpperCase();

        // 2) Se não for OWNER → perfil de usuário normal
        if (role !== 'OWNER') {
          location.href = '/user.html';
          return;
        }

        // 3) Se for OWNER → buscar slug/id do estabelecimento
        // TROQUE "places" e "owner_id" se os nomes da sua tabela forem outros
        const { data: places, error: placeError } = await supabase
          .from('venues')            // ex.: tabela de estabelecimentos
          .select('id, slug')        // campos que você precisa
          .eq('owner_id', user.id)   // FK para o dono
          .limit(1);

        if (placeError) {
          console.warn('[perfil] erro buscando estabelecimento do owner, indo para /owner.html', placeError);
          location.href = '/owner.html'; // fallback: painel do dono
          return;
        }

        const place = places?.[0];

        if (!place) {
          // Dono ainda não cadastrou estabelecimento → manda pro painel pra configurar
          location.href = '/owner.html';
          return;
        }

        // 4) Montar URL de perfil do dono
        // Troque "/owner-profile.html" pela sua página de perfil público
        const basePath = '/profile.html';

        const url = `${basePath}?slug=${encodeURIComponent(place.slug)}`;
        ;

        location.href = url;
      } catch (err) {
        console.error('[perfil] erro inesperado', err);
        // fallback seguro
        location.href = '/user.html';
      }
    });

  </script>
