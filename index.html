    /* ===== MODAL ===== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 999;
    }

    .modal-backdrop[aria-hidden="false"] {
      display: flex;
    }

    .modal {
      background: #fff;
      width: min(520px, 100%);
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, .2);
      padding: 1.25rem 1.5rem 1.5rem;
    }

    .modal h2 {
      margin: .25rem 0 1rem;
      font-size: 1.15rem;
      font-weight: 700;
    }

    .modal form label {
      display: block;
      margin: .5rem 0;
      font-size: .9rem;
      color: #374151;
    }

    .modal form input[type="number"] {
      width: 100%;
      padding: .55rem .75rem;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      font-size: 1rem;
      font-family: inherit;
      transition: border-color .2s;
    }

    .modal form input[type="number"]:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,.1);
    }

    .modal .actions {
      display: flex;
      gap: .5rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .modal .actions button {
      border: 0;
      border-radius: 999px;
      padding: .6rem 1rem;
      cursor: pointer;
      font-family: inherit;
      font-size: .9rem;
      font-weight: 600;
      transition: all .2s;

    }

    .navbar .brand:hover {

    }

    /* Center nav links */
    .navbar .nav-center {

      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-center {
      background-color: rgba(0, 0, 0, 0.1);
      padding: 3px;
      border-radius: 999px;
    }

    .navbar .nav-link {
      color: #6b7280;
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
      padding: 8px 16px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all .2s;
    }

    .navbar .nav-link:hover {
      color: #111827;
      background: #f3f4f6;
    }

    .navbar .nav-link.is-active {

    /* Right side */

    .navbar .nav-login {

      padding: 8px 16px;

      color: #111827;
    }

    .navbar .nav-login svg {

    .navbar .nav-pill {

      font-size: 13px;
      padding: 0 18px;
      height: 36px;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: none;
      transition: all .2s;
    }

    .navbar .nav-pill:hover {

    }

    /* Responsive navbar */

  <!-- Script PERFIL (somente lógica do botão) -->
  <script type="module">

    // use as MESMAS credenciais que você usa no projeto
    const SUPABASE_URL = "https://ezptlmzxosdssqtwqzrg.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6cHRsbXp4b3Nkc3NxdHdxenJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTgzMDkwNDgsImV4cCI6MjA3Mzg4NTA0OH0.rzKy_WfK0Ut6Vc9bm8IbnKTzsFpWgA6b6amW2xgqJec";

    // Reutiliza client se já existir; senão cria.
    const supabase = window.supabase ?? createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    window.supabase = supabase;
    const btnProfile = document.getElementById('btnPerfil');

    btnProfile?.addEventListener('click', async (e) => {
      e.preventDefault();
      try {
        const { data: { user }, error: userError } = await supabase.auth.getUser();
        if (userError) throw userError;

        // Sem sessão → manda pro login
        if (!user) {
          location.href = '/login.html';
          return;
        }

        // 1) Descobrir a role
        const { data: prof, error: profError } = await supabase
          .from('profiles')
          .select('role')
          .eq('id', user.id)
          .single();

        if (profError) {
          console.warn('[perfil] erro buscando role, caindo em /user.html', profError);
          location.href = '/user.html';
          return;
        }

        const role = (prof?.role || 'USER').toUpperCase();

        // 2) Se não for OWNER → perfil de usuário normal
        if (role !== 'OWNER') {
          location.href = '/user.html';
          return;
        }

        // 3) Se for OWNER → buscar slug/id do estabelecimento
        // TROQUE "places" e "owner_id" se os nomes da sua tabela forem outros
        const { data: places, error: placeError } = await supabase
          .from('venues')            // ex.: tabela de estabelecimentos
          .select('id, slug')        // campos que você precisa
          .eq('owner_id', user.id)   // FK para o dono
          .limit(1);

        if (placeError) {
          console.warn('[perfil] erro buscando estabelecimento do owner, indo para /owner.html', placeError);
          location.href = '/owner.html'; // fallback: painel do dono
          return;
        }

        const place = places?.[0];

        if (!place) {
          // Dono ainda não cadastrou estabelecimento → manda pro painel pra configurar
          location.href = '/owner.html';
          return;
        }

        // 4) Montar URL de perfil do dono
        // Troque "/owner-profile.html" pela sua página de perfil público
        const basePath = '/profile.html';

        const url = `${basePath}?slug=${encodeURIComponent(place.slug)}`;
        ;

        location.href = url;
      } catch (err) {
        console.error('[perfil] erro inesperado', err);
        // fallback seguro
        location.href = '/user.html';
      }
    });

  </script>
